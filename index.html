<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Caméra</title>

  <!-- Style minimaliste Android-like -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Roboto", sans-serif;
      background: #0d0d0d;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 40px;
      font-weight: 500;
    }

    .btn {
      width: 80%;
      max-width: 320px;
      padding: 18px;
      margin: 12px 0;
      border-radius: 12px;
      border: none;
      font-size: 1.2rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .camera {
      background: #1e88e5;
    }
    .camera:hover {
      background: #1565c0;
    }

    .viewer {
      background: #43a047;
    }
    .viewer:hover {
      background: #2e7d32;
    }
  </style>
</head>

<body>

  <h1>Choisir un mode</h1>

  <button class="btn camera" onclick="location.href='camera.html'">
    Utiliser comme caméra
  </button>

  <button class="btn viewer" onclick="location.href='viewer.html'">
    Accéder à une caméra
  </button>

</body>
</html>
