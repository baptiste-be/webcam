<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirCam®</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #00f2fe; --secondary: #4facfe; }
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; width: 100%; max-width: 380px; padding: 2rem; }
        .btn-gradient { background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%); color: #0f172a; font-weight: 800; border-radius: 1rem; transition: all 0.2s; }
        .btn-gradient:disabled { opacity: 0.5; cursor: not-allowed; }
        video { border-radius: 20px; width: 100%; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        .pin-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 242, 254, 0.3); }
    </style>
</head>
<body>

    <div id="setup-screen" class="glass text-center shadow-2xl">
        <h1 class="text-4xl font-black mb-2">AirCam<span class="text-cyan-400">®</span></h1>
        <p class="text-slate-400 text-sm mb-8 italic">Connexion Sécurisée Point-à-Point</p>
        <button onclick="startAsCamera()" class="w-full btn-gradient py-5 mb-4 uppercase tracking-wider">Diffuser ma Caméra</button>
        <button onclick="showViewerInput()" class="w-full bg-slate-800 border border-slate-700 py-5 rounded-2xl font-bold">Rejoindre un flux</button>
    </div>

    <div id="camera-screen" class="glass hidden text-center">
        <video id="localVideo" autoplay playsinline muted class="mb-6"></video>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="pin-box p-3 rounded-xl">
                <span class="block text-[10px] text-cyan-400 uppercase font-bold">PIN 1</span>
                <b id="display-pin1" class="text-xl font-mono">--------</b>
            </div>
            <div class="pin-box p-3 rounded-xl">
                <span class="block text-[10px] text-cyan-400 uppercase font-bold">PIN 2</span>
                <b id="display-pin2" class="text-xl font-mono">--------</b>
            </div>
        </div>
        <p class="text-xs text-slate-400 animate-pulse">En attente de connexion...</p>
    </div>

    <div id="viewer-screen" class="glass hidden">
        <div id="input-area">
            <h2 class="text-xl font-bold mb-6 text-center">Entrez les codes <span class="text-cyan-400">AirCam®</span></h2>
            <input type="number" id="input-pin1" placeholder="PIN 1 (8 chiffres)" class="w-full p-4 mb-3 rounded-xl bg-slate-900 border border-slate-700 text-center text-xl font-mono outline-none focus:border-cyan-400">
            <input type="number" id="input-pin2" placeholder="PIN 2 (8 chiffres)" class="w-full p-4 mb-6 rounded-xl bg-slate-900 border border-slate-700 text-center text-xl font-mono outline-none focus:border-cyan-400">
            <button id="btn-connect" onclick="connectToCamera()" class="w-full btn-gradient py-5 uppercase tracking-widest">Se Connecter</button>
        </div>
        <div id="video-area" class="hidden">
            <video id="remoteVideo" autoplay playsinline class="mb-4 border-2 border-cyan-500/50"></video>
            <button onclick="location.reload()" class="w-full text-slate-500 text-sm">Quitter</button>
        </div>
    </div>

    <script>
        let peer;
        let localStream;

        function genPin() { return Math.floor(10000000 + Math.random() * 90000000).toString(); }

        // --- LOGIQUE CAMÉRA ---
        async function startAsCamera() {
            const p1 = genPin(); const p2 = genPin();
            const fullId = "ac-" + p1 + p2;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                
                peer = new Peer(fullId);
                peer.on('open', (id) => {
                    document.getElementById('display-pin1').innerText = p1;
                    document.getElementById('display-pin2').innerText = p2;
                    document.getElementById('setup-screen').classList.add('hidden');
                    document.getElementById('camera-screen').classList.remove('hidden');
                });

                peer.on('call', (call) => {
                    call.answer(localStream); // On envoie le flux
                });

                peer.on('error', (err) => {
                    console.error(err);
                    alert("Erreur réseau. Essayez de rafraîchir.");
                });
            } catch (e) { alert("Activez la caméra (HTTPS requis)"); }
        }

        // --- LOGIQUE VISIONNEUR ---
        function showViewerInput() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('viewer-screen').classList.remove('hidden');
        }

        function connectToCamera() {
            const p1 = document.getElementById('input-pin1').value;
            const p2 = document.getElementById('input-pin2').value;
            if (p1.length < 8 || p2.length < 8) return alert("Codes incomplets");

            const targetId = "ac-" + p1 + p2;
            const btn = document.getElementById('btn-connect');
            btn.innerText = "RECHERCHE...";
            btn.disabled = true;

            peer = new Peer(); // ID aléatoire pour celui qui regarde
            
            peer.on('open', () => {
                // On appelle la caméra. On envoie un stream vide car PeerJS nécessite un stream pour l'appel.
                const call = peer.call(targetId, new MediaStream());
                
                call.on('stream', (remoteStream) => {
                    document.getElementById('input-area').classList.add('hidden');
                    document.getElementById('video-area').classList.remove('hidden');
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });

                // Si pas de réponse après 7s
                setTimeout(() => {
                    if (document.getElementById('video-area').classList.contains('hidden')) {
                        alert("Caméra introuvable. Vérifiez que la caméra est bien allumée sur l'autre appareil.");
                        btn.innerText = "SE CONNECTER";
                        btn.disabled = false;
                    }
                }, 7000);
            });
        }
    </script>
</body>
</html>
