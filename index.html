<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirCam®</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .offline { background: #ef4444; }
        video { width: 100%; border-radius: 1.5rem; background: #000; aspect-ratio: 9/16; object-fit: cover; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="mb-6 text-sm font-mono opacity-70">
        <span id="dot" class="status-dot offline"></span> Réseau : <span id="status-text">Déconnecté</span>
    </div>

    <div id="screen-choice" class="glass p-8 w-full max-w-sm text-center shadow-2xl">
        <h1 class="text-3xl font-black mb-6 italic">AirCam<span class="text-cyan-400">®</span></h1>
        <button onclick="initPeer(true)" class="w-full bg-cyan-500 text-slate-900 font-bold py-4 rounded-xl mb-4 shadow-lg shadow-cyan-500/20">📱 MODE CAMÉRA</button>
        <button onclick="initPeer(false)" class="w-full bg-slate-700 py-4 rounded-xl font-bold">📺 MODE VISIONNEUR</button>
    </div>

    <div id="screen-camera" class="glass p-4 w-full max-w-sm hidden">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="mt-4 p-4 bg-slate-900/50 rounded-2xl border border-cyan-500/30">
            <p class="text-[10px] text-cyan-400 font-bold uppercase mb-2 text-center tracking-widest">Identifiants AirCam®</p>
            <div class="flex justify-around text-2xl font-mono font-bold tracking-tighter">
                <span id="p1" class="text-white">--------</span>
                <span class="opacity-30">|</span>
                <span id="p2" class="text-white">--------</span>
            </div>
        </div>
    </div>

    <div id="screen-viewer" class="glass p-6 w-full max-w-sm hidden">
        <div id="viewer-controls">
            <h2 class="text-lg font-bold mb-4 text-center">Connexion au flux</h2>
            <input type="number" id="in1" placeholder="PIN 1" class="w-full p-4 mb-2 bg-slate-900 rounded-xl text-center text-xl outline-none border border-slate-700 focus:border-cyan-500">
            <input type="number" id="in2" placeholder="PIN 2" class="w-full p-4 mb-4 bg-slate-900 rounded-xl text-center text-xl outline-none border border-slate-700 focus:border-cyan-500">
            <button onclick="connectNow()" class="w-full bg-cyan-500 text-slate-900 font-bold py-4 rounded-xl">REJOINDRE</button>
        </div>
        <video id="remoteVideo" autoplay playsinline class="hidden mt-4"></video>
    </div>

    <div id="debug" class="mt-6 text-[10px] font-mono text-slate-500 max-w-xs text-center"></div>

    <script>
        let peer;
        let isCameraMode = false;

        function log(msg) { document.getElementById('debug').innerText = msg; }

        function initPeer(asCamera) {
            isCameraMode = asCamera;
            const config = {
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            };

            // Si camera, on génère un ID fixe basé sur les PIN
            let customId = null;
            let pin1, pin2;
            if(asCamera) {
                pin1 = Math.floor(10000000 + Math.random() * 90000000).toString();
                pin2 = Math.floor(10000000 + Math.random() * 90000000).toString();
                customId = "air-" + pin1 + pin2;
            }

            peer = customId ? new Peer(customId, config) : new Peer(config);

            peer.on('open', (id) => {
                document.getElementById('dot').className = "status-dot online";
                document.getElementById('status-text').innerText = "En ligne";
                document.getElementById('screen-choice').classList.add('hidden');
                
                if(asCamera) {
                    document.getElementById('screen-camera').classList.remove('hidden');
                    document.getElementById('p1').innerText = pin1;
                    document.getElementById('p2').innerText = pin2;
                    startCamera();
                } else {
                    document.getElementById('screen-viewer').classList.remove('hidden');
                }
            });

            peer.on('error', (err) => {
                log("Erreur : " + err.type);
                alert("Erreur réseau : " + err.type);
            });
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
                document.getElementById('localVideo').srcObject = stream;
                peer.on('call', (call) => call.answer(stream));
                log("Caméra prête et en attente.");
            } catch (e) { log("Erreur Caméra : " + e.message); }
        }

        function connectNow() {
            const id = "air-" + document.getElementById('in1').value + document.getElementById('in2').value;
            log("Tentative de connexion à " + id);
            
            // On appelle avec un stream vide (obligatoire pour PeerJS)
            const call = peer.call(id, new MediaStream());
            
            call.on('stream', (remoteStream) => {
                log("Flux reçu !");
                document.getElementById('viewer-controls').classList.add('hidden');
                const rv = document.getElementById('remoteVideo');
                rv.classList.remove('hidden');
                rv.srcObject = remoteStream;
            });

            setTimeout(() => {
                if(document.getElementById('remoteVideo').classList.contains('hidden')) {
                    log("Timeout : Caméra introuvable ou signal bloqué.");
                }
            }, 8000);
        }
    </script>
</body>
</html>
